name: Check scores on real companies

on:
  push:
    branches: [main]
    paths: ["api/**", "tools/**", "tests/**", "index.html"]
  workflow_dispatch:
    inputs:
      tickers:
        description: "Tickers to check, separated by spaces (blank = the standard list)"
        required: false
        default: ""
      inspect:
        description: "Instead, list what one company files: TICKER [regex]"
        required: false
        default: ""
      site:
        description: "Instead, test the live site at this address (e.g. https://stock-scorecard.vercel.app)"
        required: false
        default: ""

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python3 tests/test_engine.py && python3 tests/test_page.py
      - name: Test the live site
        if: ${{ github.event.inputs.site }}
        run: python3 tools/smoke.py "${{ github.event.inputs.site }}"
      - name: Score real companies
        if: ${{ !github.event.inputs.inspect && !github.event.inputs.site }}
        env:
          SEC_UA: ${{ secrets.SEC_UA }}
          DUMP_JSON: ${{ github.event.inputs.tickers }}
        run: python3 tools/check.py ${{ github.event.inputs.tickers }}
      - name: Inspect one company's filings
        if: ${{ github.event.inputs.inspect }}
        env:
          SEC_UA: ${{ secrets.SEC_UA }}
        run: for t in ${{ github.event.inputs.inspect }}; do python3 tools/inspect.py "$t"; echo; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scores
          path: out/
          retention-days: 7
